<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallingford CERT — Visual Aid</title>
<meta name="description" content="Original diagrams and animations illustrating CERT Basic Training concepts, with sources and the matching slide.">
<meta name="theme-color" content="#5aaa3a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wallingford CERT Reference Guide">
<style>
  :root {
    --bg:#0e1208; --surface:#1a2012; --surface2:#243018; --border:#3a5228;
    --primary:#5aaa3a; --primary-dark:#4a8f2e; --primary-light:#7ac95a;
    --text:#eef2e8; --text-muted:#8aa87a; --radius:12px; --gold:#e8c33a;
  }
  [data-theme="light"]{
    --bg:#eef3e7; --surface:#ffffff; --surface2:#e7eedd; --border:#c2d2af;
    --primary:#41902e; --primary-dark:#317022; --primary-light:#5aaa3a;
    --text:#16210d; --text-muted:#5c6e4a; --muted:#5c6e4a;
  }
  [data-theme="light"] header{background:#e3ecd6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;}

  header{width:100%;background:#111a09;border-bottom:3px solid var(--primary);
    padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  #cert-logo{height:48px;width:auto;}
  .logo-badge{background:var(--primary);color:#000;font-weight:900;font-size:1.05rem;
    letter-spacing:.1em;padding:6px 12px;border-radius:6px;}
  header h1{font-size:1.15rem;font-weight:700;color:var(--primary);}
  header p{font-size:0.78rem;color:var(--text-muted);}
  .hdr-text{flex:1 1 0;min-width:0;}
  .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .home-link{color:var(--primary-light);text-decoration:none;font-size:0.85rem;
    font-weight:600;border:1px solid var(--border);padding:8px 15px;border-radius:8px;
    transition:.15s;white-space:nowrap;}
  .home-link:hover{background:var(--surface2);border-color:var(--primary);}
  @media (max-width:600px){ header{flex-wrap:wrap;} .hdr-actions{margin-left:0;width:100%;justify-content:center;} }

  .toolbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);
    border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tb-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
    border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:0.82rem;
    font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .tb-btn:hover:not(:disabled){border-color:var(--primary);background:var(--border);}
  .tb-btn:disabled{opacity:.4;cursor:default;}
  .tb-spacer{flex:1 1 auto;}

  main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:28px 20px 48px;}
  .dv-media{width:100%;border-radius:var(--radius);overflow:hidden;background:#000;margin-bottom:20px;
    border:1px solid var(--border);}
  .dv-media img, .dv-media video{width:100%;height:auto;display:block;}
  .dv-kicker{font-size:0.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:6px;}
  .dv-title{font-size:1.6rem;font-weight:800;color:var(--primary);margin-bottom:14px;}
  .dv-desc{font-size:0.96rem;color:var(--text);opacity:.92;line-height:1.65;margin-bottom:22px;}

  .dv-sources{margin-bottom:26px;}
  .dv-sources-label{font-size:0.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);
    font-weight:700;margin-bottom:8px;}
  .dv-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .dv-chip{font-size:0.78rem;color:var(--primary-light);text-decoration:none;border:1px solid var(--border);
    background:var(--surface2);padding:7px 12px;border-radius:20px;transition:.15s;}
  .dv-chip:hover{border-color:var(--primary);background:var(--border);}

  .dv-slide-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:26px;}
  .dv-slide-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .dv-slide-title{font-weight:700;color:var(--primary);font-size:0.95rem;}
  .dv-slide-num{font-size:0.7rem;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);
    border-radius:20px;padding:2px 9px;}
  .dv-slide-text{font-size:0.88rem;line-height:1.6;white-space:pre-line;color:var(--text);opacity:.9;margin-bottom:12px;}
  .dv-slide-links{display:flex;gap:16px;flex-wrap:wrap;}
  .dv-slide-links a{font-size:0.8rem;color:var(--primary-light);text-decoration:none;font-weight:600;}
  .dv-slide-links a:hover{text-decoration:underline;}

  .dv-nav{display:flex;gap:10px;justify-content:center;margin-top:8px;}

  footer{text-align:center;padding:20px;color:var(--text-muted);font-size:0.76rem;border-top:1px solid var(--border);}
  footer a{color:var(--primary-light);}

  @media (max-width:600px){
    header{padding:10px 16px;}
    main{padding:20px 14px 36px;}
    .dv-title{font-size:1.3rem;}
  }
</style>
</head>
<body>

<header>
  <img id="cert-logo" src="cert-wallingford-logo.png" alt="Wallingford CERT"
    onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
  <div id="logo-fallback" style="display:none;align-items:center;"><div class="logo-badge">CERT</div></div>
  <div class="hdr-text">
    <h1>Wallingford CERT — Visual Aid</h1>
    <p>Community Emergency Response Team</p>
  </div>
  <div class="hdr-actions">
    <a class="home-link" href="search.html">🔍 Search</a>
    <a class="home-link" href="diagrams.html">🖼 Visual Aids</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle light or dark mode">☀️</button>
  </div>
</header>

<div class="toolbar">
  <button class="tb-btn" id="prev-btn" title="Previous diagram">‹ Prev</button>
  <div class="tb-spacer"></div>
  <a class="tb-btn" href="diagrams.html">🖼 All Visual Aids</a>
  <button class="tb-btn" id="next-btn" title="Next diagram">Next ›</button>
</div>

<main id="main">
  <div class="dv-note" style="display:none"></div>
</main>

<footer>
  <span style="color:var(--primary)">Wallingford CERT</span> — Reference Guide · Visual Aids ·
  <a href="changelog.html">Changelog</a>
</footer>

<script src="reference-sections.js"></script>
<script src="data/deck-text.js"></script>
<script src="data/diagrams.js"></script>
<script>
const $ = id => document.getElementById(id);
function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const params = new URLSearchParams(location.search);
const id = params.get('id');
const idx = DIAGRAMS.findIndex(d => d.id === id);
const d = idx >= 0 ? DIAGRAMS[idx] : null;

function render(){
  if (!d){
    $('main').innerHTML = `<div class="dv-note">Diagram not found. <a href="diagrams.html">Back to Visual Aids</a>.</div>`;
    $('prev-btn').disabled = true; $('next-btn').disabled = true;
    return;
  }
  document.title = 'Wallingford CERT — ' + d.title;

  const prev = DIAGRAMS[(idx - 1 + DIAGRAMS.length) % DIAGRAMS.length];
  const next = DIAGRAMS[(idx + 1) % DIAGRAMS.length];
  $('prev-btn').onclick = () => location.href = 'diagram.html?id=' + prev.id;
  $('next-btn').onclick = () => location.href = 'diagram.html?id=' + next.id;

  const sec = DECK_TEXT.sections.find(s => s.base === d.docBase);
  const page = sec && sec.pages.find(p => p.n === d.slide);

  const sourcesHtml = d.sources.map(s => `<a class="dv-chip" href="${s.href}">${esc(s.label)}</a>`).join('');

  const slideBoxHtml = page ? `
    <div class="dv-slide-box">
      <div class="dv-slide-head">
        <span class="dv-slide-title">📄 From the course slide</span>
        <span class="dv-slide-num">${esc(sec.name)} · Slide ${d.slide} / ${sec.pageCount}</span>
      </div>
      <div class="dv-slide-text">${esc(page.text || '(No extractable text for this slide.)')}</div>
      <div class="dv-slide-links">
        <a href="transcript.html?doc=${d.docBase}#slide-${d.slide}">Read full transcript →</a>
        <a href="viewer.html?doc=${d.docBase}&slide=${d.slide}" target="_blank" rel="noopener">View original slide ↗</a>
      </div>
    </div>` : '';

  $('main').innerHTML = `
    <div class="dv-media">${diagramMediaHtml(d)}</div>
    <div class="dv-kicker">${esc(d.sectionLabel)}</div>
    <div class="dv-title">${d.icon} ${esc(d.title)}</div>
    <div class="dv-desc">${esc(d.long)}</div>
    <div class="dv-sources">
      <div class="dv-sources-label">References</div>
      <div class="dv-chip-row">${sourcesHtml}</div>
    </div>
    ${slideBoxHtml}
    <div class="dv-nav">
      <a class="tb-btn" href="diagrams.html">← Back to Visual Aids</a>
    </div>`;
}
render();
</script>
</body>
</html>
